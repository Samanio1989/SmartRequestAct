<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARU | ระบบคำขอกิจกรรมนักศึกษา</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://unpkg.com/lucide@latest"></script><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script><link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>body{font-family:Kanit,sans-serif}input,select,textarea{width:100%;border:1px solid #dbe3ef;border-radius:12px;padding:10px;background:white}button{transition:.2s}.card{background:white;border-radius:18px;padding:18px;box-shadow:0 6px 24px #15264b0c}.nav.active{background:#e9f0ff;color:#1d4ed8}.nav{padding:12px;border-radius:12px;display:flex;gap:10px;align-items:center}.btn{background:#1d4ed8;color:white;padding:10px 17px;border-radius:12px}.btn:disabled{opacity:.45}.field{display:block;font-size:13px;color:#475569;margin-bottom:5px}#loader{background:#ffffffbb;backdrop-filter:blur(2px)}.hide{display:none!important}</style></head><body class="bg-slate-50 text-slate-800"><div id="toast" class="fixed top-4 right-4 z-[80] hidden max-w-sm rounded-xl bg-slate-900 text-white p-4 shadow-xl"></div><div id="loader" class="hidden fixed inset-0 z-[90] flex items-center justify-center"><div class="card text-center"><div class="animate-spin rounded-full h-10 w-10 border-4 border-blue-600 border-t-transparent mx-auto mb-3"></div>กำลังดำเนินการ...</div></div><section id="login" class="min-h-screen flex items-center justify-center p-4"><form id="loginForm" class="card w-full max-w-md space-y-4"><div class="text-center"><div class="text-4xl mb-2">🎓</div><h1 class="text-2xl font-semibold text-blue-900">ระบบคำขอกิจกรรมนักศึกษา</h1><p class="text-sm text-slate-500">Passcode 66–68 / Check-In 69</p></div><div><label class="field">ชื่อผู้ใช้</label><input name="username" required autocomplete="username"></div><div><label class="field">รหัสผ่าน</label><input name="password" type="password" required autocomplete="current-password"></div><button class="btn w-full">เข้าสู่ระบบ</button><p class="text-xs text-center text-slate-500">สำหรับเจ้าหน้าที่คณะและหน่วยงานภายในมหาวิทยาลัย</p></form></section><section id="app" class="hidden"><aside id="sidebar" class="hidden md:flex fixed inset-y-0 left-0 w-64 bg-white border-r p-5 flex-col z-30"><h2 class="text-xl font-bold text-blue-900 mb-8">ARU REQUEST</h2><nav id="sideNav" class="space-y-2 flex-1"></nav><button onclick="confirmLogout()" class="nav text-red-600"><i data-lucide="log-out"></i> ออกจากระบบ</button></aside><main class="md:ml-64 min-h-screen pb-24 md:pb-8"><header class="bg-white border-b px-4 md:px-8 py-4 flex justify-between items-center sticky top-0 z-20"><div><h1 id="pageTitle" class="font-semibold text-lg">ภาพรวมระบบ</h1><p id="identity" class="text-xs text-slate-500"></p></div><button onclick="confirmLogout()" class="md:hidden text-red-600" aria-label="ออกจากระบบ"><i data-lucide="log-out"></i></button></header><div id="content" class="p-4 md:p-8 max-w-7xl mx-auto"></div></main><div id="adminPanel" class="hidden fixed bottom-16 left-2 right-2 bg-white rounded-2xl p-4 shadow-2xl z-40 border"><div class="flex justify-between mb-3"><b>เมนูผู้ดูแลระบบ</b><button onclick="togglePanel()">✕</button></div><div id="adminGrid" class="grid grid-cols-3 gap-2"></div></div><nav id="bottomNav" class="md:hidden fixed bottom-0 inset-x-0 bg-white border-t z-40 flex justify-around p-2"></nav></section><div id="modal" class="hidden fixed inset-0 bg-slate-950/40 z-[70] flex items-center justify-center p-4"><div class="card max-w-sm w-full"><h3 class="font-semibold text-lg">ยืนยันออกจากระบบ?</h3><p class="text-slate-500 text-sm my-3">คุณต้องเข้าสู่ระบบอีกครั้ง</p><div class="flex justify-end gap-2"><button class="p-3" onclick="closeModal()">ยกเลิก</button><button class="btn" onclick="logout()">ออกจากระบบ</button></div></div></div><script>
'use strict';
// CONFIG: กรอก URL และ anon/publishable key ของ Supabase Project เดิม
const CONFIG={url:'YOUR_SUPABASE_URL',key:'YOUR_SUPABASE_ANON_KEY',bucket:'request-files',loginRpc:'request_login',sessionRpc:'request_verify_session',logoutRpc:'request_logout'};
const dbClient=window.supabase.createClient(CONFIG.url,CONFIG.key,{auth:{persistSession:false}});
let currentUser=null,sessionToken=sessionStorage.getItem('aru_request_token'),page='dashboard',requests=[],chart=null,admin=false;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const busy=v=>$('#loader').classList.toggle('hidden',!v);function toast(msg,error=false){let el=$('#toast');el.textContent=msg;el.className='fixed top-4 right-4 z-[80] max-w-sm rounded-xl text-white p-4 shadow-xl '+(error?'bg-red-700':'bg-slate-900');setTimeout(()=>el.classList.add('hidden'),4500)};
async function callRpc(name,args){const {data,error}=await dbClient.rpc(name,args);if(error)throw error;return data}
function formatDate(d){return d?new Date(d).toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'}):'-'}
const menu=[['dashboard','layout-dashboard','ภาพรวม'],['mine','clipboard-list','คำขอของฉัน'],['new-passcode','key-round','ขอ Passcode'],['new-checkin','map-pin','ขอ Check-In'],['notifications','bell','แจ้งเตือน'],['all','list-checks','จัดการคำขอ'],['reports','chart-column','รายงาน']];
function icon(n){return `<i data-lucide="${n}" class="w-5 h-5"></i>`}function refreshIcons(){lucide.createIcons()}
function navTo(p){page=p;$('#adminPanel').classList.add('hidden');render();window.scrollTo({top:0,behavior:'smooth'})}
function renderNav(){let visible=menu.filter(x=>admin||!['all','reports'].includes(x[0]));$('#sideNav').innerHTML=visible.map(([p,i,n])=>`<button class="nav w-full ${p===page?'active':''}" onclick="navTo('${p}')">${icon(i)}${n}</button>`).join('');let mobile=visible.filter(x=>['dashboard','mine','new-passcode','new-checkin'].includes(x[0]));$('#bottomNav').innerHTML=mobile.map(([p,i,n])=>`<button class="flex flex-col items-center text-[10px] gap-1 ${p===page?'text-blue-700':''}" onclick="navTo('${p}')">${icon(i)}${n}</button>`).join('')+(admin?`<button onclick="togglePanel()" class="flex flex-col items-center text-[10px] gap-1 text-blue-700">${icon('menu')}จัดการ</button>`:`<button onclick="navTo('notifications')" class="flex flex-col items-center text-[10px] gap-1">${icon('bell')}แจ้งเตือน</button>`);$('#adminGrid').innerHTML=menu.filter(x=>['all','reports','notifications'].includes(x[0])).map(([p,i,n])=>`<button class="rounded-xl bg-slate-50 p-3 flex flex-col items-center gap-2 text-xs" onclick="navTo('${p}')">${icon(i)}${n}</button>`).join('');refreshIcons()}
function togglePanel(){$('#adminPanel').classList.toggle('hidden')}function confirmLogout(){$('#modal').classList.remove('hidden')}function closeModal(){$('#modal').classList.add('hidden')}
async function logout(){busy(true);try{if(sessionToken)await callRpc(CONFIG.logoutRpc,{p_token:sessionToken})}catch(e){console.warn(e)}finally{busy(false);sessionStorage.removeItem('aru_request_token');sessionToken=null;currentUser=null;requests=[];$('#app').classList.add('hidden');$('#login').classList.remove('hidden');closeModal();$('#loginForm').reset()}}
async function signIn(e){e.preventDefault();busy(true);try{let f=new FormData(e.target);const data=await callRpc(CONFIG.loginRpc,{p_username:f.get('username'),p_password:f.get('password')});let result=Array.isArray(data)?data[0]:data;if(!result?.success||!result.session_token)throw Error(result?.message||'เข้าสู่ระบบไม่สำเร็จ');sessionToken=result.session_token;sessionStorage.setItem('aru_request_token',sessionToken);currentUser=result;admin=result.role==='admin'||result.request_role==='ADMIN';await enter()}catch(e){toast(e.message,true)}finally{busy(false)}}
async function enter(){$('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#identity').textContent=currentUser.full_name||currentUser.username;await loadRequests();render()}
async function restore(){if(!sessionToken)return;busy(true);try{let data=await callRpc(CONFIG.sessionRpc,{p_token:sessionToken});let user=Array.isArray(data)?data[0]:data;if(!user?.valid)throw Error('Session หมดอายุ');currentUser=user;admin=user.role==='admin'||user.request_role==='ADMIN';await enter()}catch(e){sessionStorage.removeItem('aru_request_token');sessionToken=null;toast('กรุณาเข้าสู่ระบบอีกครั้ง',true)}finally{busy(false)}}
async function loadRequests(){const q=dbClient.from('request_activities').select('*').order('created_at',{ascending:false}).limit(500);const {data,error}=await q;if(error)throw error;requests=admin?data:data.filter(x=>x.requester_user_id===currentUser.user_id)}
function status(s){return ({DRAFT:'แบบร่าง',SUBMITTED:'ส่งคำขอแล้ว',UNDER_REVIEW:'กำลังตรวจสอบ',REVISION_REQUESTED:'ขอแก้ไข',RESUBMITTED:'ส่งแก้ไขแล้ว',APPROVED:'อนุมัติ',PROCESSING:'กำลังดำเนินการ',COMPLETED:'เสร็จสิ้น',REJECTED:'ไม่อนุมัติ',CANCELLED:'ยกเลิก'})[s]||s}
function render(){renderNav();$('#pageTitle').textContent=({dashboard:'ภาพรวมระบบ',mine:'คำขอของฉัน','new-passcode':'คำขอ Passcode','new-checkin':'คำขอ Check-In',notifications:'การแจ้งเตือน',all:'จัดการคำขอ',reports:'รายงาน'})[page]||'ระบบคำขอ';if(page==='dashboard')dashboard();else if(page==='mine'||page==='all')listPage();else if(page.startsWith('new-'))requestForm(page==='new-passcode'?'PASSCODE':'CHECKIN');else if(page==='notifications')notifications();else if(page==='reports')reports();refreshIcons()}
function dashboard(){let c=s=>requests.filter(x=>x.status===s).length;$('#content').innerHTML=`<div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-6">${[['คำขอทั้งหมด',requests.length],['รอตรวจสอบ',c('SUBMITTED')+c('RESUBMITTED')],['กำลังดำเนินการ',c('PROCESSING')],['เสร็จสิ้น',c('COMPLETED')]].map(([n,v])=>`<div class="card"><div class="text-xs text-slate-500">${n}</div><div class="text-3xl font-bold text-blue-900">${v}</div></div>`).join('')}</div><div class="grid lg:grid-cols-2 gap-4"><div class="card"><h3 class="font-semibold mb-4">ประเภทคำขอ</h3><div class="max-w-xs mx-auto"><canvas id="chart"></canvas></div></div><div class="card"><h3 class="font-semibold mb-4">คำขอล่าสุด</h3>${requestTable(requests.slice(0,5))}</div></div>`;if(chart)chart.destroy();chart=new Chart($('#chart'),{type:'doughnut',data:{labels:['Passcode','Check-In'],datasets:[{data:[requests.filter(x=>x.request_type==='PASSCODE').length,requests.filter(x=>x.request_type==='CHECKIN').length],backgroundColor:['#1d4ed8','#06b6d4']}]},options:{plugins:{legend:{position:'bottom'}}}})}
function requestTable(rows){return `<div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-left text-slate-500 border-b"><th class="p-2">เลขคำขอ</th><th class="p-2">กิจกรรม</th><th class="p-2">วันจัด</th><th class="p-2">สถานะ</th></tr></thead><tbody>${rows.map(r=>`<tr class="border-b"><td class="p-2 whitespace-nowrap">${esc(r.request_no||'-')}</td><td class="p-2">${esc(r.activity_name)}</td><td class="p-2 whitespace-nowrap">${formatDate(r.activity_start_at)}</td><td class="p-2">${status(r.status)}</td></tr>`).join('')||'<tr><td colspan="4" class="p-6 text-center text-slate-400">ยังไม่มีข้อมูล</td></tr>'}</tbody></table></div>`}
function listPage(){let rows=page==='mine'?requests.filter(r=>r.requester_user_id===currentUser.user_id):requests;$('#content').innerHTML=`<div class="card"><div class="flex gap-3 mb-4 flex-wrap"><input id="filter" class="max-w-sm" placeholder="ค้นหาชื่อกิจกรรม / เลขคำขอ" oninput="filterRows()"><button class="btn" onclick="loadAndRender()">รีเฟรชข้อมูล</button></div><div id="listRows">${requestTable(rows)}</div></div>`}
function filterRows(){let s=$('#filter').value.toLowerCase(),rows=(page==='mine'?requests.filter(r=>r.requester_user_id===currentUser.user_id):requests).filter(r=>`${r.activity_name} ${r.request_no}`.toLowerCase().includes(s));$('#listRows').innerHTML=requestTable(rows)}
async function loadAndRender(){busy(true);try{await loadRequests();render()}catch(e){toast(e.message,true)}finally{busy(false)}}
function requestForm(type){$('#content').innerHTML=`<form id="requestForm" class="space-y-4"><div class="card"><div class="font-semibold text-lg mb-4">${type==='PASSCODE'?'คำขอ Passcode รหัส 66–68':'คำขอ Check-In รหัส 69'}</div><div class="grid md:grid-cols-2 gap-4"><div class="md:col-span-2"><label class="field">ชื่อกิจกรรม *</label><input name="activity_name" required></div><div><label class="field">เริ่มกิจกรรม *</label><input name="activity_start_at" type="datetime-local" required></div><div><label class="field">สิ้นสุดกิจกรรม *</label><input name="activity_end_at" type="datetime-local" required></div><div class="md:col-span-2"><label class="field">สถานที่จัดกิจกรรม *</label><input name="venue" required></div><div><label class="field">ระดับกิจกรรม *</label><select name="activity_level" required><option value="FACULTY">ระดับคณะ</option>${currentUser.request_role==='UNIT'||admin?'<option value="UNIVERSITY">ระดับมหาวิทยาลัย</option>':''}${currentUser.request_role==='FACULTY'||admin?'<option value="PROGRAM">ระดับสาขาวิชา</option>':''}</select></div>${type==='PASSCODE'?`<div><label class="field">ชั้นปี *</label><select name="target_year"><option value="YEAR_2">ชั้นปี 2</option><option value="YEAR_3">ชั้นปี 3</option><option value="YEAR_4_PLUS">ชั้นปี 4 และค้างรุ่น</option><option value="YEAR_2_TO_4">ชั้นปี 2–4</option></select></div><div><label class="field">วิธีดำเนินการ *</label><select name="processing_mode"><option value="PASSCODE">รับ Passcode</option><option value="AUTO_PASS">ผ่านกิจกรรมทันที (ไม่รับ Passcode)</option></select></div>`:''}</div></div>${type==='CHECKIN'?['checkin','checkout'].map(k=>`<div class="card"><h3 class="font-semibold mb-3">${k==='checkin'?'Check-In':'Check-Out'}</h3><div class="grid md:grid-cols-2 gap-3"><div><label class="field">เวลาเปิด *</label><input name="${k}_start_at" type="datetime-local" required></div><div><label class="field">เวลาปิด *</label><input name="${k}_end_at" type="datetime-local" required></div><div class="md:col-span-2"><label class="field">Google Maps URL</label><input name="${k}_map_url" placeholder="วางลิงก์แผนที่"></div><div><label class="field">Latitude *</label><input name="${k}_latitude" type="number" step="any" min="-90" max="90" required></div><div><label class="field">Longitude *</label><input name="${k}_longitude" type="number" step="any" min="-180" max="180" required></div><div><label class="field">รัศมี (เมตร)</label><input name="${k}_radius" type="number" min="10" max="5000" value="100"></div></div></div>`).join(''):''}<div class="card space-y-3"><h3 class="font-semibold">ไฟล์ประกอบ</h3><div><label class="field">กำหนดการ PDF/ภาพ *</label><input name="schedule" type="file" accept=".pdf,image/*" required></div><div><label class="field">รายชื่อนักศึกษา Excel (.xlsx) *</label><input name="students" type="file" accept=".xlsx" required></div>${type==='CHECKIN'?'<div><label class="field">แบนเนอร์กิจกรรม (ถ้ามี)</label><input name="banner" type="file" accept="image/*"></div>':''}<div><label class="field">หมายเหตุ</label><textarea name="requester_note" rows="2"></textarea></div><div id="deadline" class="text-sm text-amber-700">ต้องส่งล่วงหน้าก่อนวันจัดกิจกรรมอย่างน้อย 3 วันปฏิทิน</div><button id="submitRequest" class="btn w-full">ส่งคำขอ</button></div></form>`;$('#requestForm').onsubmit=e=>submitRequest(e,type);$('#requestForm [name=activity_start_at]').addEventListener('change',checkDeadline)}
function checkDeadline(){let d=$('#requestForm [name=activity_start_at]').value;let today=new Date(),start=new Date(d);const bangkokDay=x=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit'}).format(x);let day=Date.parse(bangkokDay(start)+'T00:00:00Z'),now=Date.parse(bangkokDay(today)+'T00:00:00Z');let ok=!!d&&(day-now)/86400000>=3;$('#submitRequest').disabled=!ok;$('#deadline').textContent=ok?'✓ วันที่จัดกิจกรรมเป็นไปตามเงื่อนไข':'⚠ ต้องส่งก่อนวันจัดกิจกรรมอย่างน้อย 3 วันปฏิทิน';return ok}
async function compressImage(file){if(!file.type.startsWith('image/'))return file;let bitmap=await createImageBitmap(file),scale=Math.min(1,1600/Math.max(bitmap.width,bitmap.height)),canvas=document.createElement('canvas');canvas.width=Math.round(bitmap.width*scale);canvas.height=Math.round(bitmap.height*scale);canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);let blob=await new Promise(r=>canvas.toBlob(r,'image/webp',.72));bitmap.close();return new File([blob],file.name.replace(/\.[^.]+$/,'.webp'),{type:'image/webp'})}
async function uploadFile(requestId,file,type){if(!file)return;file=await compressImage(file);let path=`${requestId}/${crypto.randomUUID()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;let {error}=await dbClient.storage.from(CONFIG.bucket).upload(path,file,{upsert:false});if(error)throw error;let result=await dbClient.from('request_files').insert({request_id:requestId,file_type:type,original_filename:file.name,storage_path:path,storage_bucket:CONFIG.bucket,mime_type:file.type,file_size:file.size,uploaded_by:currentUser.user_id});if(result.error)throw result.error}
async function submitRequest(e,type){e.preventDefault();if(!checkDeadline())return toast('วันจัดกิจกรรมไม่ผ่านเงื่อนไข',true);busy(true);try{let f=new FormData(e.target),start=new Date(f.get('activity_start_at')),end=new Date(f.get('activity_end_at'));if(end<start)throw Error('เวลาสิ้นสุดต้องไม่ก่อนเวลาเริ่ม');let excel=f.get('students');if(!excel?.name.toLowerCase().endsWith('.xlsx'))throw Error('กรุณาแนบไฟล์ .xlsx');let wb=XLSX.read(await excel.arrayBuffer(),{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1});if(rows.length<2||rows[0].length<3)throw Error('Excel ต้องมีหัวตารางและคอลัมน์รหัสนักศึกษา ชื่อ-สกุล สาขาวิชา');let record={request_type:type,requester_user_id:currentUser.user_id,activity_name:f.get('activity_name'),activity_start_at:start.toISOString(),activity_end_at:end.toISOString(),venue:f.get('venue'),activity_level:f.get('activity_level'),requester_note:f.get('requester_note'),status:'SUBMITTED'};let {data,error}=await dbClient.from('request_activities').insert(record).select('id').single();if(error)throw error;let id=data.id,details=type==='PASSCODE'?{request_id:id,target_year:f.get('target_year'),processing_mode:f.get('processing_mode')}:{request_id:id};if(type==='CHECKIN')for(let k of ['checkin','checkout'])for(let key of ['start_at','end_at','map_url','latitude','longitude','radius']){let v=f.get(`${k}_${key}`);details[`${k}_${key}`]=['start_at','end_at'].includes(key)?new Date(v).toISOString():['latitude','longitude','radius'].includes(key)?Number(v):v}let table=type==='PASSCODE'?'request_passcode_details':'request_checkin_details';let d=await dbClient.from(table).insert(details);if(d.error)throw d.error;await uploadFile(id,f.get('schedule'),'SCHEDULE');await uploadFile(id,excel,'STUDENT_LIST');if(type==='CHECKIN'&&f.get('banner')?.size)await uploadFile(id,f.get('banner'),'BANNER');toast('ส่งคำขอเรียบร้อย');await loadRequests();navTo('mine')}catch(e){toast(e.message,true)}finally{busy(false)}}
async function notifications(){busy(true);try{let {data,error}=await dbClient.from('request_notifications').select('*').eq('user_id',currentUser.user_id).order('created_at',{ascending:false}).limit(100);if(error)throw error;$('#content').innerHTML=`<div class="space-y-3">${data.map(n=>`<div class="card"><b>${esc(n.title)}</b><p class="text-sm">${esc(n.message)}</p><small class="text-slate-400">${formatDate(n.created_at)}</small></div>`).join('')||'<div class="card">ยังไม่มีการแจ้งเตือน</div>'}</div>`}catch(e){toast(e.message,true)}finally{busy(false)}}
function reports(){$('#content').innerHTML=`<div class="card"><h3 class="font-semibold mb-3">ดาวน์โหลดรายงานคำขอ</h3><button class="btn" onclick="exportCSV()">ดาวน์โหลด CSV</button></div>`}function exportCSV(){let headers=['request_no','request_type','activity_name','activity_start_at','activity_end_at','venue','status'],csv='\uFEFF'+[headers.join(','),...requests.map(r=>headers.map(h=>'"'+String(r[h]??'').replace(/"/g,'""')+'"').join(','))].join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='request_report.csv';a.click();URL.revokeObjectURL(a.href)}
$('#loginForm').addEventListener('submit',signIn);restore();
</script></body></html>
